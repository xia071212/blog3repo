  <g id="text_24">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18283e" x="74.52" y="52.5312" transform="rotate(-0 74.52 52.5312)">Income years 2022–2024 pooled. Age groups compare different people, not individual career paths.</text>
