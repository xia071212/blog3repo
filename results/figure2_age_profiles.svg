  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586575" x="74.52" y="428.544" transform="rotate(-0 74.52 428.544)">Source: IPUMS CPS ASEC, extract 1. Ages 25–64, full-time/full-year wage and salary workers.</text>
